<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Çayır Çimen Geze Geze</title>
  <meta name="description" content="Hava, mevsim ve yola göre puanlanan yürüyüş rotaları">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Archivo:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--paper:#f3efe6;--paper2:#e9e3d6;--card:#faf8f3;--ink:#1d1c18;--ink2:#4a4740;--mute:#857f73;--line:#d6cfbf;--blaze:#e2532d;--moss:#2f5b3c;--moss2:#5d8a4e;--ochre:#b8862a;
      --display:"Unbounded",sans-serif;--body:"Archivo",sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--body)}
    button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
    .shell{max-width:1380px;margin:auto;padding:0 32px}
    .mono{font-family:var(--mono)}
    /* üst */
    .topbar{display:flex;justify-content:space-between;align-items:center;height:60px;border-bottom:1.5px solid var(--ink)}
    .brand{font:700 14px var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:10px}.brand i{display:inline-block;width:14px;height:14px;background:var(--blaze);border-radius:2px;box-shadow:5px 5px 0 var(--ink)}
    .txtbtn{border:0;background:none;padding:6px 0;font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;border-bottom:1.5px solid transparent}.txtbtn:hover{border-color:var(--ink)}
    .hero{position:relative;padding:44px 0 30px;overflow:hidden}
    .hero:after{content:"";position:absolute;right:-120px;top:-140px;width:560px;height:560px;background:repeating-radial-gradient(ellipse at 50% 50%,transparent 0 21px,#1d1c1815 21px 22.5px);border-radius:46% 54% 51% 49%/55% 44% 56% 45%;transform:rotate(-12deg);pointer-events:none}
    .hero h1{position:relative;z-index:1;font:900 clamp(40px,6.4vw,84px)/.92 var(--display);letter-spacing:-.05em;margin:0}.hero h1 em{font-style:normal;color:var(--blaze)}
    .hero p{position:relative;z-index:1;margin:16px 0 0;font:500 13px var(--mono);color:var(--ink2)}
    /* araç çubuğu */
    .toolbar{display:flex;justify-content:space-between;align-items:stretch;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
    .months{display:flex;overflow-x:auto;scrollbar-width:none}.months::-webkit-scrollbar{display:none}
    .m{border:0;background:none;padding:13px 12px;font:700 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--mute);position:relative;white-space:nowrap}.m:hover{color:var(--ink)}
    .m.on{color:var(--ink)}.m.on:after{content:"";position:absolute;left:8px;right:8px;bottom:-1.5px;height:4px;background:var(--blaze)}
    .m.now:before{content:"";position:absolute;top:8px;right:6px;width:4px;height:4px;border-radius:50%;background:var(--moss2)}
    .fbtn{border:0;border-left:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:0 20px;font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px;white-space:nowrap}.fbtn:hover{background:var(--blaze)}.fbtn span:not(:empty){background:var(--blaze);color:white;padding:1px 6px;border-radius:2px}.fbtn:hover span{background:var(--ink)}
    .status{display:flex;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;padding:12px 0;font:500 12px var(--mono);color:var(--ink2);text-transform:uppercase;letter-spacing:.03em}
    .status b{color:var(--ink)}.status .dot{display:inline-block;width:8px;height:8px;margin-right:7px;background:var(--ochre)}.status .dot.ok{background:var(--moss2)}.status .dot.err{background:var(--blaze)}
    .status button{border:0;background:none;text-decoration:underline;font:inherit;padding:0;margin-left:8px}
    .afs{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 12px var(--mono)}.afs:empty{display:none}.af{border:0;background:none;padding:0;border-bottom:1px dashed var(--ink2)}.af:hover{color:var(--blaze);border-color:var(--blaze)}
    /* içerik */
    .content{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:36px;align-items:start;padding-bottom:40px}
    .list{border-top:1.5px solid var(--ink)}
    .row{display:grid;grid-template-columns:30px 68px minmax(0,1fr) 84px;gap:16px;align-items:center;padding:14px 10px 14px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
    .row:hover,.row:focus-visible{background:var(--paper2);outline:0}.row.sel{background:var(--paper2)}
    .rank{font:700 13px var(--mono);color:var(--mute)}.row:first-child .rank{color:var(--blaze)}
    .row img{width:68px;height:68px;object-fit:cover;border-radius:3px;background:var(--paper2);filter:saturate(.8) contrast(1.02)}
    .row h3{margin:0;font:700 15.5px/1.25 var(--body);letter-spacing:-.01em}
    .meta{margin-top:3px;font:500 11.5px var(--mono);color:var(--mute)}
    .why{margin-top:5px;font-size:13px;color:var(--ink2)}.why:before{font:700 12px var(--mono);margin-right:6px}.why.pro:before{content:"+";color:var(--moss)}.why.con:before{content:"−";color:var(--blaze)}
    .sc{text-align:right}.sc b{display:block;font:700 26px/1 var(--mono);letter-spacing:-.04em}.sc i{display:block;height:3px;background:var(--line);margin:7px 0 6px 18px}.sc i s{display:block;height:100%;background:currentColor;text-decoration:none}
    .sc small{display:block;font:700 10px var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
    .t-great{color:var(--moss)}.t-good{color:var(--moss2)}.t-ok{color:var(--ochre)}.t-low{color:var(--blaze)}
    .more{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:16px;font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;text-align:left}.more:hover{background:var(--paper2)}
    .pass{padding:16px 4px 4px;font-size:13px;color:var(--ink2);line-height:1.7}.pass b{font:700 11px var(--mono);letter-spacing:.06em;color:var(--blaze);margin-right:6px}.pass span{white-space:nowrap}
    .out{margin-top:10px}.out summary{list-style:none;cursor:pointer;padding:10px 4px;font:700 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}.out summary::-webkit-details-marker{display:none}.out summary:before{content:"+ "}.out[open] summary:before{content:"− "}
    .orow{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:9px 4px;border-top:1px solid var(--line);cursor:pointer;font-size:13px}.orow:hover{background:var(--paper2)}.orow b{font:700 13px var(--mono)}.orow span{color:var(--mute)}
    .empty{padding:40px 4px;font:500 14px var(--mono);color:var(--ink2)}
    .mapcol{position:sticky;top:16px;height:calc(100vh - 32px);min-height:440px;max-height:780px;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--paper2)}
    #map{height:100%}.leaflet-layer.base{filter:grayscale(.55) sepia(.18) contrast(.96) brightness(1.02)}.leaflet-container{font-family:var(--body);background:var(--paper2)}
    .maplabel{position:absolute;z-index:500;left:10px;bottom:10px;background:var(--ink);color:var(--paper);font:700 11px var(--mono);padding:5px 8px;text-transform:uppercase;letter-spacing:.04em}
    footer{border-top:1.5px solid var(--ink);padding:16px 0 28px;font:500 11px var(--mono);color:var(--mute)}
    /* pencereler */
    dialog{border:1.5px solid var(--ink);border-radius:4px;padding:0;background:var(--card);color:var(--ink);box-shadow:10px 10px 0 #1d1c1830}dialog::backdrop{background:#1d1c1866}
    .x{border:1.5px solid var(--ink);background:none;width:34px;height:34px;font:500 18px/1 var(--mono);border-radius:2px;flex:none}.x:hover{background:var(--ink);color:var(--paper)}
    .sheet{width:min(460px,calc(100% - 32px));max-height:calc(100vh - 40px)}.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1.5px solid var(--ink)}.sheet-head h2{margin:0;font:900 20px var(--display);letter-spacing:-.03em}
    .fbody{padding:4px 18px}.field{padding:14px 0;border-bottom:1px solid var(--line)}.field:last-child{border:0}.field>label,.field .lab{display:block;font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
    .field select{width:100%;border:1.5px solid var(--ink);border-radius:2px;background:var(--card);padding:9px 10px;font-size:14px}.field.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field input[type=range]{width:100%;accent-color:var(--blaze)}
    .seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{border:1.5px solid var(--line);background:none;border-radius:2px;padding:7px 10px;font:500 12px var(--mono)}.seg button:hover{border-color:var(--ink)}.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
    .sheet-foot{position:sticky;bottom:0;display:flex;gap:8px;padding:14px 18px;background:var(--card);border-top:1.5px solid var(--ink)}.sheet-foot button{border-radius:2px;padding:12px 14px;font:700 12px var(--mono);letter-spacing:.05em;text-transform:uppercase}
    .ghost{border:1.5px solid var(--ink);background:none}.primary{flex:1;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper)}.primary:hover{background:var(--blaze);border-color:var(--blaze)}
    /* rota penceresi */
    .modal{width:min(1040px,calc(100% - 32px));max-height:calc(100vh - 40px)}
    .mhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:20px 22px 16px;border-bottom:1.5px solid var(--ink)}
    .mhead small{font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}.mhead h2{margin:6px 0 0;font:900 clamp(22px,3vw,32px)/1.05 var(--display);letter-spacing:-.04em}
    .mgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}.mgrid>div{padding:20px 22px}.mgrid>div+div{border-left:1.5px solid var(--ink)}
    .scorehead{display:flex;align-items:center;gap:16px}.scorehead>b{font:700 64px/.9 var(--mono);letter-spacing:-.06em}.scorehead strong{display:block;font:900 18px var(--display);letter-spacing:-.03em;color:var(--ink)}.scorehead span{display:block;margin-top:4px;font:500 11px var(--mono);color:var(--mute)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 0;border-top:1px solid var(--line)}.stats div{padding:10px 8px 10px 0;border-bottom:1px solid var(--line)}.stats b{display:block;font:700 16px var(--mono);letter-spacing:-.02em}.stats span{font:500 10.5px var(--mono);color:var(--mute);text-transform:uppercase}
    .pc{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;list-style:none;margin:0;padding:0;font-size:13.5px}.pc li{padding-left:16px;position:relative}.pc li:before{position:absolute;left:0;font:700 13px var(--mono)}.pc .pro:before{content:"+";color:var(--moss)}.pc .con:before{content:"−";color:var(--blaze)}
    .chart{margin-top:22px}.chart h4{margin:0 0 8px;font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}.chart h4 span{color:var(--mute);font-weight:500;text-transform:none;letter-spacing:0;margin-left:6px}
    .chart svg{width:100%;display:block;overflow:visible}.chart .l,.chart .l2,.chart .v{font:500 9.5px var(--mono);fill:var(--mute);text-anchor:middle}.chart .v{fill:var(--ink2);font-weight:700}
    .yb .bar{fill:var(--ink);opacity:.22}.yb.on .bar{fill:var(--blaze);opacity:1}.yb.on .l{fill:var(--ink);font-weight:700}.yb .hit{fill:transparent}.yb{cursor:pointer}.yb:hover .bar{opacity:.5}.yb.on:hover .bar{opacity:1}
    .db .bar{fill:var(--ink);opacity:.22}.db.best .bar{fill:var(--blaze);opacity:1}.db.out .bar{opacity:.1}.db.best.out .bar{opacity:.45}
    .thr{stroke:var(--ink);stroke-dasharray:3 4;stroke-width:1;opacity:.5}
    .bd{margin:8px 0 0;font-size:13px;color:var(--ink2)}.bd b{color:var(--ink)}.muted{font:500 12px var(--mono);color:var(--mute);margin:0}
    .mapcap{margin:6px 0 0;font:500 10.5px var(--mono);color:var(--mute)}#modalMap{height:300px;border:1.5px solid var(--ink);border-radius:2px}
    .warn{margin:16px 0 0;padding-left:12px;border-left:4px solid var(--blaze);font-size:13.5px;color:var(--ink2)}
    .lodge{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}.lodge h4{margin:0 0 8px;font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}.lodge h4 span{color:var(--mute);font-weight:500}
    .kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kv b{display:block;font:700 15px var(--mono)}.kv span,.lodge small{font:500 10.5px var(--mono);color:var(--mute);text-transform:uppercase}
    .links{display:flex;gap:18px;margin-top:18px;font:700 12px var(--mono);letter-spacing:.04em;text-transform:uppercase}.links a{text-decoration:none;border-bottom:1.5px solid var(--ink)}.links a:hover{color:var(--blaze);border-color:var(--blaze)}
    /* öneri */
    .sbody{padding:14px 18px 18px}.sbody form{display:grid;gap:8px}.sbody input,.sbody select,.sbody textarea{width:100%;border:1.5px solid var(--line);border-radius:2px;background:var(--card);padding:10px;font-size:14px;outline:none}.sbody input:focus,.sbody select:focus,.sbody textarea:focus{border-color:var(--ink)}.sbody textarea{min-height:76px;resize:vertical}
    .sactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.sactions button{border:1.5px solid var(--ink);border-radius:2px;background:none;padding:10px 12px;font:700 11px var(--mono);letter-spacing:.05em;text-transform:uppercase}.sactions .suggestion-submit{background:var(--ink);color:var(--paper)}
    .suggestion-status,.suggestion-list{display:block;margin-top:8px;font:500 11px var(--mono);color:var(--mute)}
    @media(max-width:900px){.shell{padding:0 16px}.content{grid-template-columns:1fr;gap:0}.mapcol{position:relative;top:0;height:300px;min-height:0;order:-1;margin:4px 0 18px}.mgrid{grid-template-columns:1fr}.mgrid>div+div{border-left:0;border-top:1.5px solid var(--ink)}.hero:after{width:380px;height:380px;right:-160px}}
    @media(max-width:600px){.toolbar{flex-direction:column}.fbtn{border-left:0;border-top:1.5px solid var(--ink);padding:12px;justify-content:center}.row{grid-template-columns:52px minmax(0,1fr) 62px;gap:12px}.rank{display:none}.row img{width:52px;height:52px}.sc b{font-size:22px}.stats{grid-template-columns:repeat(2,1fr)}.pc{grid-template-columns:1fr}.modal,.sheet{width:100%;max-width:100%;height:100%;max-height:100%;border:0;box-shadow:none}.mhead,.mgrid>div{padding:16px}.scorehead>b{font-size:52px}}
  </style>
</head>
<body>
<div class="shell">
  <nav class="topbar"><div class="brand"><i></i>çayır çimen geze geze</div><button type="button" class="txtbtn" id="openSuggest">+ Rota öner</button></nav>
  <header class="hero"><h1>Nereye<br><em>kaçıyoruz?</em></h1><p>hava + mevsim + yol → skor. gerisi bacaklarda.</p></header>
  <main>
    <section class="toolbar"><div class="months" id="months"></div><button type="button" class="fbtn" id="openFilters">Filtre<span id="filterCount"></span></button></section>
    <div class="status" id="status"></div>
    <div class="afs" id="activeFilters"></div>
    <section class="content"><div><div class="list" id="routes"><div class="empty">Yükleniyor…</div></div><div id="rest"></div></div><aside class="mapcol"><div id="map"></div><div class="maplabel" id="maplabel"></div></aside></section>
  </main>
  <footer>Skorlar tahmin, dağ ciddi. Çıkmadan önce güncel durumu kontrol et. · Hava: Open-Meteo · Harita: OpenStreetMap</footer>
</div>
<dialog class="sheet" id="filterDialog"><div class="sheet-head"><h2>Filtre</h2><button type="button" class="x" id="filterClose" aria-label="Kapat">×</button></div><div class="fbody" id="filterBody"></div><div class="sheet-foot"><button type="button" class="ghost" id="filterReset">Sıfırla</button><button type="button" class="primary" id="filterApply">Göster</button></div></dialog>
<dialog class="modal" id="routeDialog"><div id="detail"></div></dialog>
<dialog class="sheet" id="suggestDialog"><div class="sheet-head"><h2>Rota öner</h2><button type="button" class="x" id="suggestClose" aria-label="Kapat">×</button></div><div class="sbody">
  <form id="suggestionForm">
    <input name="name" required placeholder="Rota adı *" autocomplete="off">
    <input name="town" placeholder="Şehir / bölge">
    <select name="month" aria-label="Ay"><option value="">Ay seç</option><option value="1">Ocak</option><option value="2">Şubat</option><option value="3">Mart</option><option value="4">Nisan</option><option value="5">Mayıs</option><option value="6">Haziran</option><option value="7">Temmuz</option><option value="8">Ağustos</option><option value="9">Eylül</option><option value="10">Ekim</option><option value="11">Kasım</option><option value="12">Aralık</option></select>
    <input name="url" type="url" placeholder="Kaynak bağlantısı">
    <textarea name="note" placeholder="Neden bu rota?"></textarea>
  </form>
  <div class="sactions"><button class="suggestion-submit" type="submit" form="suggestionForm">Kaydet</button><button type="button" id="exportSuggestions">İndir</button><button type="button" id="openIssue">GitHub issue</button></div>
  <span class="suggestion-status" id="suggestionStatus"></span><span class="suggestion-list" id="suggestionList"></span>
</div></dialog>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const prefs=store.get("ccgg-prefs",{});
let catalog,routes=[],month=new Date().getMonth()+1,area=prefs.area||"all",difficulty=prefs.difficulty||"all",trip=prefs.trip||"all",len=prefs.len||"all",people=prefs.people||2,nights=prefs.nights??1,origin=prefs.origin||"any",minScore=prefs.minScore??65,selected=null,map,markerLayer,lastFit="";
let wx={month:null,status:"idle",byKey:{},mode:null,label:""};
const savePrefs=()=>store.set("ccgg-prefs",{area,difficulty,trip,len,people,nights,origin:origin==="geo"?"any":origin,minScore});
const monthNames=["","OCAK","ŞUBAT","MART","NİSAN","MAYIS","HAZİRAN","TEMMUZ","AĞUSTOS","EYLÜL","EKİM","KASIM","ARALIK"];
const monthTr=["","Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const MS=["","Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const regions={all:"Tümü",between:"İkinizin ortası",munich:"Münih çevresi",heilbronn:"Heilbronn çevresi",stuttgart:"Stuttgart çevresi",austrian_alps:"Avusturya Alpleri",dolomites:"Dolomitler",northern_italy:"Kuzey İtalya",tr_marmara:"Türkiye · Marmara",tr_aegean:"Türkiye · Ege",tr_mediterranean:"Türkiye · Akdeniz",tr_central:"Türkiye · İç Anadolu",tr_black_sea_west:"Türkiye · Batı Karadeniz",tr_black_sea_east:"Türkiye · Doğu Karadeniz",tr_east:"Türkiye · Doğu Anadolu"};
const ORIGINS={any:{n:"Fark etmez"},munich:{n:"Münih",lat:48.137,lon:11.575},heilbronn:{n:"Heilbronn",lat:49.142,lon:9.218},middle:{n:"İkinizin ortası (Ulm)",lat:48.401,lon:9.987},istanbul:{n:"İstanbul",lat:41.008,lon:28.978},ankara:{n:"Ankara",lat:39.933,lon:32.86},izmir:{n:"İzmir",lat:38.42,lon:27.14},antalya:{n:"Antalya",lat:36.897,lon:30.713},geo:{n:"Konumum"}};
// [temel güvenlik puanı, açıklama]
const RISK={ordinary_trail:[100,null],protected_area_check:[90,"Koruma alanı: izin ve kuralları kontrol et"],route_choice_required:[85,"Etap seçimi gerekiyor"],remote_trail:[80,"Issız parkur; navigasyon ve erzak şart"],mountain_weather:[80,"Dağ havası hızla değişebilir"],seasonal_alpine:[80,"Alpin rota; sezon açılışını kontrol et"],exposed_or_slippery:[75,"Kaygan / açık bölümler var"],exposure:[70,"Uçurum kenarı / açık bölümler"],steep_or_exposed:[70,"Dik ve açık bölümler"],high_alpine:[65,"Yüksek dağ rotası"]};
const ALPINE=new Set(["seasonal_alpine","high_alpine","mountain_weather","exposure","steep_or_exposed"]);
const SLIPPERY=new Set(["exposed_or_slippery","exposure","steep_or_exposed","high_alpine","remote_trail"]);
const PART_LABELS={season:"Mevsim",weather:"Hava",risk:"Güvenlik",daylight:"Gün ışığı",access:"Ulaşım",fit:"Plan uyumu",data:"Veri güveni"};

const coordKey=r=>`${(+r.lat).toFixed(2)},${(+r.lon).toFixed(2)}`;
const iso=d=>d.toISOString().slice(0,10);
function monthRange(ms){ms=[...(ms||[])].sort((a,b)=>a-b);if(!ms.length)return "—";const out=[];let s=ms[0],p=ms[0];for(const m of ms.slice(1).concat(null)){if(m===p+1){p=m;continue}out.push(s===p?MS[s]:`${MS[s]}–${MS[p]}`);s=p=m}return out.join(", ")}

/* ---------- Hava durumu (Open-Meteo, anahtarsız) ---------- */
const WX_DAILY="temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum,wind_speed_10m_max,sunshine_duration";
function summarize(days){const v=f=>days.map(d=>d[f]).filter(x=>x!=null),avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null,pr=v("pr"),sn=v("snow");return{days:days.length,tmax:avg(v("tmax")),tmin:avg(v("tmin")),rain:pr.length?pr.filter(x=>x>=1).length/pr.length:null,snow:sn.length?sn.filter(x=>x>=.5).length/sn.length:null,wind:avg(v("wind")),sun:avg(v("sun")),pop:avg(v("pop"))}}
async function fetchJson(u){const res=await fetch(u),j=await res.json();if(!res.ok||j.error)throw new Error(j.reason||res.status);return Array.isArray(j)?j:[j]}
function wxPlan(m){const now=new Date(),cm=now.getMonth()+1,y=now.getFullYear();if(m===cm)return{mode:"forecast"};const yr=m<cm?y:y-1;return{mode:"climate",years:[yr,yr-1]}}
function pruneWxCache(){try{for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&k.startsWith("ccgg-wx-")&&!k.startsWith("ccgg-wx-v1-"))localStorage.removeItem(k);if(k&&k.startsWith("ccgg-wx-v1-")&&k.includes("forecast")&&!k.endsWith(iso(new Date())))localStorage.removeItem(k)}}catch(e){}}
let staticWx=null;
async function fallbackWeather(m){
  const last=store.get(`ccgg-wx-v1-last-${m}`,null);
  if(last?.byKey)return{byKey:last.byKey,label:`Canlı veri alınamadı · ${new Date(last.at).toLocaleDateString("tr-TR")} tarihli önbellek kullanılıyor (${last.label})`};
  try{await loadStatic();const byKey=staticWx.months?.[m];
    if(byKey&&Object.keys(byKey).length)return{byKey,label:`Canlı veri alınamadı · yedek veri: ${monthTr[m]} ortalaması (${staticWx.start.slice(0,7)} – ${staticWx.end.slice(0,7)})`}}catch(e){staticWx=null}
  return null}
async function ensureWeather(m){
  if(wx.month===m&&(wx.status==="ok"||wx.status==="loading"))return;
  const plan=wxPlan(m),now=new Date(),mm=String(m).padStart(2,"0"),keys=[...new Set(routes.filter(r=>r.lat!=null&&r.lon!=null).map(coordKey))];
  const cacheKey=`ccgg-wx-v1-${m}-${plan.mode}-${plan.mode==="forecast"?iso(now):plan.years[0]}`,cached=store.get(cacheKey,null);
  if(cached&&keys.every(k=>cached.byKey[k])&&(plan.mode==="climate"||Date.now()-cached.at<3*3600e3)){wx={month:m,status:"ok",byKey:cached.byKey,mode:plan.mode,label:cached.label};render();return}
  wx={month:m,status:"loading",byKey:{},mode:plan.mode,label:plan.mode==="forecast"?"Canlı tahmin yükleniyor…":"Geçmiş hava verisi yükleniyor…"};render();
  try{
    const lat=keys.map(k=>k.split(",")[0]).join(","),lon=keys.map(k=>k.split(",")[1]).join(",");let byKey={},label;
    if(plan.mode==="forecast"){
      const f=await getForecast(),pre=`-${mm}-`;let span=0;keys.forEach(k=>{const all=f.days[k]||[];let ds=all.filter(d=>d.date.slice(4,8)===pre);if(ds.length<5)ds=all;span=ds.length;byKey[k]=summarize(ds)});
      label=`Canlı tahmin · önümüzdeki ${span} gün`;
    }else{
      const lim=new Date(Date.now()-6*864e5),parts=await Promise.all(plan.years.map(yr=>{let end=new Date(Date.UTC(yr,m,0));if(end>lim)end=lim;return fetchJson(`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${yr}-${mm}-01&end_date=${iso(end)}&daily=${WX_DAILY}&timezone=auto`)}));
      keys.forEach((k,i)=>{byKey[k]=summarize(parts.flatMap(p=>p[i]?.daily?toDays(p[i].daily):[]))});
      label=`${monthTr[m]} ${plan.years[1]} ve ${plan.years[0]} gerçekleşen hava ortalaması`;
    }
    if(wx.month!==m)return;
    wx={month:m,status:"ok",byKey,mode:plan.mode,label};pruneWxCache();store.set(cacheKey,{at:Date.now(),byKey,label});store.set(`ccgg-wx-v1-last-${m}`,{at:Date.now(),byKey,label});
  }catch(e){if(wx.month!==m)return;const fb=await fallbackWeather(m);if(wx.month!==m)return;wx=fb?{month:m,status:"stale",byKey:fb.byKey,mode:"fallback",label:fb.label}:{month:m,status:"error",byKey:{},mode:plan.mode,label:"Hava verisi alınamadı; skor yalnızca mevsim, gün ışığı, risk ve ulaşıma göre hesaplandı."}}
  render();
}

/* ---------- Skor ---------- */
function scoreRoute(r,m,wIn){
  const pros=[],cons=[],parts={},add=(arr,t,w,k)=>arr.push({t,w,k});
  if(!(r.months_possible||[]).includes(m)){add(cons,`Sezon dışı (açık: ${monthRange(r.months_possible)})`,100,"season");return{score:0,parts:{season:0},pros,cons,w:null,out:true}}
  const best=(r.months_best||[]).includes(m);parts.season=best?100:60;
  best?add(pros,"Tam sezonu",20,"season"):add(cons,`Sezonun kenarı (en iyisi ${monthRange(r.months_best)})`,10,"offpeak");
  const w=wIn!==undefined?wIn:wx.month===m&&(wx.status==="ok"||wx.status==="stale")?wx.byKey[coordKey(r)]:null,hasW=!!(w&&w.tmax!=null),alpine=ALPINE.has(r.technical_risk),winter=!!r.winter_designated;
  if(hasW){
    const t=w.tmax;let ts;
    if(winter){ts=t<=4?100:clamp(100-(t-4)*10);t<=4?add(pros,`${Math.round(t)}°C, kış için ideal`,10,"temp"):add(cons,`${Math.round(t)}°C, kar az olabilir`,12,"warm")}
    else{ts=t<12?clamp(100-(12-t)*7):t>25?clamp(100-(t-25)*7):100;
      if(t<12)add(cons,`${t<5?"Soğuk":"Serin"}, ${Math.round(t)}°C`,(100-ts)*.4,"cold");
      else if(t>27)add(cons,`Sıcak, ${Math.round(t)}°C · erken çık`,(100-ts)*.4+3,"hot");
      else add(pros,`${Math.round(t)}°C, tam kıvamında`,12,"temp")}
    const rp=Math.round((w.rain??0)*100);let rs=clamp(100-rp*1.3);if(w.pop!=null)rs=(rs+clamp(100-w.pop))/2;
    if(rs<55)add(cons,`Yağışlı, %${rp} gün`,(100-rs)*.3,"rain");else if(rp<=20)add(pros,`Kuru hava`,8,"dry");
    const sp=w.snow??0,ss=winter?100:clamp(100-sp*300);
    if(!winter&&sp>=.08)add(cons,`Kar ihtimali`,(100-ss)*.3,"snow");
    const ws=w.wind==null||w.wind<=25?100:clamp(100-(w.wind-25)*2.5);if(ws<70)add(cons,`Rüzgarlı, ~${Math.round(w.wind)} km/s`,(100-ws)*.1,"wind");
    if(w.sun!=null&&w.sun>=7)add(pros,`Günde ~${Math.round(w.sun)} sa güneş`,5,"sun");
    parts.weather=Math.round(ts*.4+rs*.3+ss*.2+ws*.1);
  }
  const [rb,rt]=RISK[r.technical_risk]||[85,null];let risk=rb;if(rt&&rb<90)add(cons,winter?"Kış koşulları; parkurun açık ve hazırlanmış olduğunu kontrol et":rt,(100-rb)*.15,"risk");
  if(hasW&&alpine&&!winter&&((w.snow??0)>=.08||w.tmin<-1)){risk-=35;add(cons,"Kar/buz riski",20,"ice")}
  if(hasW&&SLIPPERY.has(r.technical_risk)&&(w.rain??0)>=.35){risk-=20;add(cons,"Yağmurda kaygan",10,"slippery")}
  parts.risk=clamp(risk);
  const day=daylight(r.lat,m),hrs=r.estimated_moving_hours??4,margin=day-(hrs+2);
  parts.daylight=Math.round(margin>=4?100:margin<=0?15:15+margin*21);
  if(margin<2)add(cons,`Gün kısa, ~${fmt(day)} sa ışık`,(100-parts.daylight)*.1+5,"daylight");else if(day>=14)add(pros,`${Math.round(day)} sa gün ışığı`,4,"day");
  const o=ORIGINS[origin];let km=null;
  if(o&&o.lat!=null){km=Math.round(haversine(o,r)*1.3/10)*10;let a;
    if(nights===0)a=km<=100?100:km<=200?100-(km-100)*.4:km<=350?60-(km-200)*.27:5;else a=km<=400?100:km<=900?100-(km-400)*.08:km<=1500?45:20;
    parts.access=Math.round(clamp(a));
    if(km<=90)add(pros,`Yakın, ~${km} km`,10,"near");
    else if(parts.access<60)add(cons,nights===0?`Günübirliğe uzak, ~${km} km`:km>1500?`Uçaklık mesafe, ~${km} km`:`Uzun yol, ~${km} km`,(100-parts.access)*.15,"far")}
  parts.fit=100;if(r.lodging?.overnight_recommended_for_trip&&nights===0){parts.fit=40;add(cons,"En az 1 gece lazım",8,"overnight")}
  parts.data={published_variant:100,planning_estimate:85,estimate:85,partial:65,unknown_route_variant:60}[r.metric_status]??70;
  if(parts.data<70)add(cons,"Km verisi kaba",2,"data");
  let sum=0,wt=0;for(const k in parts){const wk=k==="access"&&nights===0?24:W[k];sum+=parts[k]*wk;wt+=wk}
  let score=sum/wt;if(parts.weather!=null&&parts.weather<55)score-=(55-parts.weather)*.8;score=Math.max(0,Math.round(score));
  if(hasW&&alpine&&!winter&&(w.snow??0)>=.2)score=Math.min(score,40);
  if(hasW&&!winter&&w.tmax<0)score=Math.min(score,35);
  if(km!=null&&nights===0&&km>350)score=Math.min(score,30);if(km!=null&&km>1500)score=Math.min(score,50);
  pros.sort((a,b)=>b.w-a.w);cons.sort((a,b)=>b.w-a.w);
  return{score,parts,pros,cons,w:hasW?w:null,day}
}

/* ---------- Tahmin: günlük veri ve en iyi günler ---------- */
let fc=null,fcPromise=null,fcFailed=false;
const FC_TTL=3*3600e3,wxKeys=()=>[...new Set(routes.filter(r=>r.lat!=null&&r.lon!=null).map(coordKey))];
function toDays(d){const g=(f,j)=>d[f]?.[j]??null;return(d.time||[]).map((t,j)=>({date:t,tmax:g("temperature_2m_max",j),tmin:g("temperature_2m_min",j),pr:g("precipitation_sum",j),pop:g("precipitation_probability_max",j),snow:g("snowfall_sum",j),wind:g("wind_speed_10m_max",j),sun:g("sunshine_duration",j)==null?null:g("sunshine_duration",j)/3600}))}
async function getForecast(){
  const keys=wxKeys();if(fc&&Date.now()-fc.at<FC_TTL&&keys.every(k=>fc.days[k]))return fc;
  const c=store.get("ccgg-fc-v1",null);if(c&&Date.now()-c.at<FC_TTL&&keys.every(k=>c.days[k])){fc=c;return fc}
  if(!fcPromise)fcPromise=(async()=>{const res=await fetchJson(`https://api.open-meteo.com/v1/forecast?latitude=${keys.map(k=>k.split(",")[0])}&longitude=${keys.map(k=>k.split(",")[1])}&daily=${WX_DAILY},precipitation_probability_max&forecast_days=16&timezone=auto`),days={};res.forEach((loc,i)=>days[keys[i]]=toDays(loc.daily));fc={at:Date.now(),days};fcFailed=false;store.set("ccgg-fc-v1",fc);return fc})().catch(e=>{fcFailed=true;throw e}).finally(()=>fcPromise=null);
  return fcPromise}
function dayScore(d,r){if(d.tmax==null)return null;const winter=!!r.winter_designated,t=d.tmax,ts=winter?(t<=4?100:clamp(100-(t-4)*10)):t<12?clamp(100-(12-t)*7):t>25?clamp(100-(t-25)*7):100,rainS=clamp(100-(d.pr??0)*12),rs=d.pop==null?rainS:(rainS+clamp(100-d.pop))/2,ss=winter?100:clamp(100-(d.snow??0)*40),ws=d.wind==null||d.wind<=25?100:clamp(100-(d.wind-25)*2.5);let s=ts*.35+rs*.4+ss*.15+ws*.1;if(ALPINE.has(r.technical_risk)&&!winter&&((d.snow??0)>.5||(d.tmin??5)<-2))s-=25;return Math.round(clamp(s))}
function bestDays(r){
  if(!fc)return null;const days=fc.days[coordKey(r)];if(!days)return null;
  const today=iso(new Date()),mm=`-${String(month).padStart(2,"0")}-`,inM=days.filter(d=>d.date>=today&&d.date.slice(4,8)===mm).map(d=>({...d,score:dayScore(d,r)})).filter(d=>d.score!=null);
  if(!inM.length)return{none:true};
  const top=[...inM].sort((a,b)=>b.score-a.score).slice(0,3),len=Math.min(nights+1,inM.length);let win=null;
  if(len>1)for(let i=0;i+len<=inM.length;i++){const sl=inM.slice(i,i+len),avg=sl.reduce((s,d)=>s+d.score,0)/len;if(!win||avg>win.avg)win={from:sl[0].date,to:sl[len-1].date,avg:Math.round(avg)}}
  return{top,win,count:inM.length}}
async function loadStatic(){if(staticWx)return staticWx;try{const r=await fetch("./weather-fallback.json");if(r.ok)staticWx=await r.json()}catch(e){}return staticWx}

/* ---------- Filtreler ---------- */
const LENGTHS={all:"Hepsi",short:"≤8 km",mid:"8–13 km",long:"13+ km"};
const TRIPS={all:"Hepsi",day:"Günübirlik",stay:"Konaklamalı"};
const DIFFS={all:"Hepsi",easy:"Kolay",moderate:"Orta",hard:"Zor"};
const REGION_GROUPS={"Almanya":["between","munich","heilbronn","stuttgart"],"Alpler ve İtalya":["austrian_alps","dolomites","northern_italy"],"Türkiye":["tr_marmara","tr_aegean","tr_mediterranean","tr_central","tr_black_sea_west","tr_black_sea_east","tr_east"]};
const DEFAULTS={area:"all",origin:"any",trip:"all",len:"all",difficulty:"all",people:2,nights:1,minScore:65};
const lenOk=r=>len==="all"||(r.distance_km!=null&&(len==="short"?r.distance_km<=8:len==="mid"?r.distance_km>8&&r.distance_km<=13:r.distance_km>13));
const tripOk=r=>trip==="all"||(trip==="stay")===!!r.lodging?.overnight_recommended_for_trip;
function scored(){const all=routes.filter(r=>(area==="all"||r.region===area)&&(difficulty==="all"||level(r)===difficulty)&&lenOk(r)&&tripOk(r)).map(r=>({r,s:scoreRoute(r,month)})).sort((a,b)=>b.s.score-a.s.score||a.r.name.localeCompare(b.r.name,"tr"));return{shown:all.filter(x=>x.s.score>=minScore),hidden:all.filter(x=>x.s.score<minScore)}}
function setFilter(k,v){showAll=false;({area:()=>area=v,origin:()=>origin=v,trip:()=>trip=v,len:()=>len=v,difficulty:()=>difficulty=v,people:()=>people=+v,nights:()=>nights=+v,minScore:()=>minScore=+v})[k]();savePrefs();render();if(filterDialog.open)renderFilters()}
function activeFilters(){const a=[];if(area!=="all")a.push(["area",regions[area]]);if(origin!=="any")a.push(["origin",`${ORIGINS[origin].n} çıkışlı`]);if(trip!=="all")a.push(["trip",TRIPS[trip]]);if(len!=="all")a.push(["len",LENGTHS[len]]);if(difficulty!=="all")a.push(["difficulty",DIFFS[difficulty]]);if(minScore!==DEFAULTS.minScore)a.push(["minScore",`min ${minScore}`]);return a}
const seg=(k,opts,cur)=>`<div class="seg">${Object.entries(opts).map(([v,n])=>`<button type="button" class="${String(cur)===v?"on":""}" data-seg="${k}" data-val="${v}">${n}</button>`).join("")}</div>`;

  const opt=(v,n,cur)=>`<option value="${v}" ${String(cur)===String(v)?"selected":""}>${n}</option>`;
  document.querySelector("#filterBody").innerHTML=`
  <div class="field"><label>Bölge</label><select data-sel="area">${opt("all","Her yer",area)}${Object.entries(REGION_GROUPS).map(([g,ids])=>`<optgroup label="${g}">${ids.map(id=>opt(id,regions[id],area)).join("")}</optgroup>`).join("")}</select></div>
  <div class="field"><label>Nereden?</label><select data-sel="origin">${Object.entries(ORIGINS).map(([k,o])=>opt(k,o.n,origin)).join("")}</select></div>
  <div class="field"><span class="lab">Gezi</span>${seg("trip",TRIPS,trip)}</div>
  <div class="field"><span class="lab">Uzunluk</span>${seg("len",LENGTHS,len)}</div>
  <div class="field"><span class="lab">Zorluk</span>${seg("difficulty",DIFFS,difficulty)}</div>
  <div class="field two"><div><label>Kişi</label><select data-sel="people">${[1,2,3,4,5,6,7,8].map(n=>opt(n,n,people)).join("")}</select></div><div><label>Gece</label><select data-sel="nights">${[0,1,2,3,4].map(n=>opt(n,n?n:"Günübirlik",nights)).join("")}</select></div></div>
  <div class="field"><label>Min. skor <span id="msv">${minScore}</span></label><input type="range" min="0" max="90" step="5" value="${minScore}" data-sel="minScore"></div>`;
  updateApply();
  document.querySelectorAll("#filterBody [data-seg]").forEach(b=>b.onclick=()=>setFilter(b.dataset.seg,b.dataset.val));
  document.querySelectorAll("#filterBody [data-sel]").forEach(el=>{const k=el.dataset.sel;if(k==="minScore")el.oninput=()=>{minScore=+el.value;document.querySelector("#msv").textContent=minScore;showAll=false;savePrefs();render();updateApply()};else el.onchange=()=>k==="origin"&&el.value==="geo"?useGeo():setFilter(k,el.value)})}

let showAll=false,modalMap=null,modalMarker=null;const PAGE=7;

const PART_SHORT={season:"mevsim",weather:"hava",risk:"güvenlik",daylight:"ışık",access:"yol",fit:"plan",data:"veri"};
const dayLabel=(date,o={day:"numeric",month:"short",weekday:"short"})=>new Date(date+"T12:00").toLocaleDateString("tr-TR",o);
function rangeLabel(a,b){const da=new Date(a+"T12:00"),db=new Date(b+"T12:00");return da.getMonth()===db.getMonth()?`${da.getDate()}–${db.getDate()} ${MS[db.getMonth()+1]}`:`${da.getDate()} ${MS[da.getMonth()+1]}–${db.getDate()} ${MS[db.getMonth()+1]}`}

function durNum(r){const h=r.estimated_moving_hours||(r.distance_km/4+(r.elevation_gain_m||0)/500);return isNaN(h)?"—":fmt(h)}
const photoCache=new Map();
async function loadPhoto(img,r){if(photoCache.has(r.id)){img.src=photoCache.get(r.id);return}let src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=300&q=70";try{const q=encodeURIComponent(r.photo?.query||r.name);const j=await(await fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${q}&gsrnamespace=6&gsrlimit=5&prop=imageinfo&iiprop=url&iiurlwidth=300&format=json&origin=*`)).json();const p=Object.values(j.query?.pages||{}).find(v=>v.imageinfo?.[0]?.thumburl&&/\.(jpe?g|png)$/i.test(v.title));if(p)src=p.imageinfo[0].thumburl}catch(e){}photoCache.set(r.id,src);img.src=src}

function renderTop(){
  const now=new Date().getMonth()+1;
  document.querySelector("#months").innerHTML=Array.from({length:12},(_,i)=>i+1).map(i=>`<button type="button" class="m ${month===i?"on":""} ${now===i?"now":""}" data-month="${i}" title="${monthTr[i]}">${MS[i]}</button>`).join("");
  document.querySelectorAll("[data-month]").forEach(b=>b.onclick=()=>setMonth(+b.dataset.month));
  const af=activeFilters();document.querySelector("#filterCount").textContent=af.length||"";
  document.querySelector("#activeFilters").innerHTML=af.map(([k,n])=>`<button type="button" class="af" data-reset="${k}" title="Kaldır">${escape(n)} ×</button>`).join("");
  document.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>setFilter(b.dataset.reset,DEFAULTS[b.dataset.reset]))}
function setMonth(m){month=m;showAll=false;render();ensureWeather(m)}
function statusHtml(shown,hidden){const st=wx.month!==month?"loading":wx.status,dot=st==="ok"?"ok":st==="error"?"err":"",txt=st==="loading"?"hava yükleniyor":st==="error"?"hava verisi yok":st==="stale"?"yedek hava verisi":wx.mode==="forecast"?"canlı tahmin":"son 2 yılın havası";
  return `<span><b>${monthTr[month]}</b> — ${shown.length} rota${hidden.length?` / ${hidden.length} elendi`:""}</span><span title="${escape(wx.month===month?wx.label:"")}"><i class="dot ${dot}"></i>${txt}${st==="error"||st==="stale"?'<button type="button" id="wxRetry">tekrar dene</button>':""}</span>`}
function row({r,s},i){const rs=reason(s),tag=bestTag(r),t=tone(s.score),w=s.w;
  return `<article class="row ${selected===r.id?"sel":""}" data-route="${escape(r.id)}" tabindex="0"><span class="rank">${String(i+1).padStart(2,"0")}</span><img alt="" loading="lazy"><div><h3>${escape(r.name)}</h3><div class="meta">${escape(r.base_town||regions[r.region])} · ${r.distance_km==null?"? km":r.distance_km+" km"} · ${lname(r).toLocaleLowerCase("tr-TR")}${w?` · ${Math.round(w.tmax)}°`:""}</div>${rs?`<div class="why ${rs[0]}">${escape(rs[1])}</div>`:""}</div><div class="sc ${TONE[t]}"><b>${s.score}</b><i><s style="width:${s.score}%"></s></i>${tag?`<small>${tag}</small>`:""}</div></article>`}
function passHtml(byReg){const items=Object.entries(byReg).map(([reg,xs])=>{const c={};xs.forEach(({s})=>{const k=s.cons.find(x=>CAT[x.k]&&x.k!=="data")?.k;if(k)c[k]=(c[k]||0)+1});const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];return `<span>${escape(regions[reg]||reg)} <i>(${top?CAT[top[0]]:"skor düşük"})</i></span>`});return items.length?`<div class="pass"><b>BU AY PAS</b>${items.join(" · ")}</div>`:""}
function render(){
  renderTop();const {shown,hidden}=scored(),vis=showAll?shown:shown.slice(0,PAGE),shownRegions=new Set(shown.map(x=>x.r.region)),byReg={};
  hidden.forEach(x=>{if(!shownRegions.has(x.r.region))(byReg[x.r.region]=byReg[x.r.region]||[]).push(x)});
  document.querySelector("#status").innerHTML=statusHtml(shown,hidden);const rb=document.querySelector("#wxRetry");if(rb)rb.onclick=()=>{ensureWeather(month);getForecast().then(render).catch(()=>render())};
  document.querySelector("#routes").innerHTML=shown.length?vis.map(row).join(""):`<div class="empty">Bu filtrelerle kimse geçemedi. Eşiği biraz gevşet?</div>`;
  document.querySelector("#rest").innerHTML=(shown.length>vis.length?`<button type="button" class="more" id="showMore">+ ${shown.length-vis.length} rota daha</button>`:"")+passHtml(byReg)+(hidden.length?`<details class="out"><summary>Elenenler (${hidden.length})</summary>${hidden.map(({r,s})=>`<div class="orow" data-route="${escape(r.id)}"><b class="${TONE[tone(s.score)]}">${s.score}</b><div>${escape(r.name)} <span>— ${escape(s.cons[0]?.t||"skor düşük")}</span></div></div>`).join("")}</details>`:"");
  const sm=document.querySelector("#showMore");if(sm)sm.onclick=()=>{showAll=true;render()};
  document.querySelectorAll("[data-route]").forEach(c=>{c.onclick=()=>openRoute(c.dataset.route);c.onkeydown=e=>{if(e.key==="Enter")openRoute(c.dataset.route)}});
  document.querySelectorAll("#routes .row").forEach((c,i)=>loadPhoto(c.querySelector("img"),vis[i].r));
  if(routeDialog.open&&selected){const r=routes.find(v=>v.id===selected);if(r)showDetail(r)}
  drawMarkers(shown);document.querySelector("#maplabel").textContent=`${shown.length} rota · renk = skor · yakınlaş: patikalar`}

/* ---------- Harita ---------- */
function tiles(m,trailMin=0){L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,className:"base",attribution:"© OpenStreetMap"}).addTo(m);L.tileLayer("https://tile.waymarkedtrails.org/hiking/{z}/{x}/{y}.png",{maxZoom:18,minZoom:trailMin,opacity:.9,attribution:'patikalar © <a href="https://hiking.waymarkedtrails.org" target="_blank" rel="noopener">Waymarked Trails</a>'}).addTo(m)}
function routeLine(r,m){const g=r.map?.geometry_geojson;if(!g)return null;try{return L.geoJSON(g,{style:{color:"#e2532d",weight:5,opacity:.95}}).addTo(m)}catch(e){return null}}
function drawMarkers(shown){if(!window.L)return;if(!map){map=L.map("map",{scrollWheelZoom:false,zoomControl:true}).setView([46,18],5);tiles(map,9);markerLayer=L.layerGroup().addTo(map)}
  markerLayer.clearLayers();shown.forEach(({r,s})=>{if(r.lat==null)return;routeLine(r,markerLayer);L.circleMarker([r.lat,r.lon],{radius:8,color:"#1d1c18",weight:1.5,fillColor:toneColor[tone(s.score)],fillOpacity:1}).bindTooltip(`${escape(r.name)} — ${s.score}`).on("click",()=>openRoute(r.id)).addTo(markerLayer)});
  const key=`${month}|${area}|${difficulty}|${minScore}|${origin}|${trip}|${len}`;if(key!==lastFit&&shown.length){lastFit=key;map.fitBounds(L.latLngBounds(shown.map(x=>[x.r.lat,x.r.lon])),{padding:[40,40],maxZoom:9})}setTimeout(()=>map.invalidateSize(),60)}
function drawModalMap(r){if(!window.L)return;if(modalMap){modalMap.remove();modalMap=null}modalMap=L.map("modalMap",{scrollWheelZoom:false});tiles(modalMap);const line=routeLine(r,modalMap);L.circleMarker([r.lat,r.lon],{radius:9,color:"#1d1c18",weight:2,fillColor:"#e2532d",fillOpacity:1}).addTo(modalMap);if(line)modalMap.fitBounds(line.getBounds(),{padding:[20,20]});else modalMap.setView([r.lat,r.lon],13);setTimeout(()=>modalMap.invalidateSize(),80)}

/* ---------- Rota grafikleri ---------- */
function yearChart(r,s){
  const vals=Array.from({length:12},(_,i)=>{const m=i+1;if(m===month)return s.score;const w=staticWx?.months?.[m]?.[coordKey(r)]??null;return scoreRoute(r,m,w).score});
  const W=480,H=128,T=16,B=18,bw=W/12,bh=H-T-B;let g="";
  vals.forEach((v,i)=>{const m=i+1,h=bh*v/100,x=i*bw+5,w=bw-10,y=H-B-h;g+=`<g class="yb ${m===month?"on":""}" data-m="${m}"><title>${monthTr[m]}: ${v}</title><rect class="hit" x="${i*bw}" y="0" width="${bw}" height="${H}"/><rect class="bar" x="${x}" y="${y}" width="${w}" height="${Math.max(h,2)}"/>${v?`<text class="v" x="${x+w/2}" y="${y-4}">${v}</text>`:""}<text class="l" x="${x+w/2}" y="${H-4}">${MS[m]}</text></g>`});
  const ty=H-B-bh*minScore/100;g+=`<line class="thr" x1="0" x2="${W}" y1="${ty}" y2="${ty}"/>`;
  return `<div class="chart"><h4>Yıl boyu<span>kesikli çizgi = eşik · aya tıkla</span></h4><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`}
function dayChart(r){
  const days=fc?.days?.[coordKey(r)];
  if(!days)return `<div class="chart"><h4>Önümüzdeki günler</h4><p class="muted">${fcFailed?"Canlı tahmin şu an yok.":"Tahmin yükleniyor…"}</p></div>`;
  const today=iso(new Date()),ds=days.filter(d=>d.date>=today).map(d=>({...d,score:dayScore(d,r)})),best=new Set(ds.filter(d=>d.score!=null).sort((a,b)=>b.score-a.score).slice(0,3).map(d=>d.date));
  const W=480,H=118,T=6,B=28,bw=W/Math.max(ds.length,1),bh=H-T-B;let g="";
  ds.forEach((d,i)=>{const v=d.score??0,h=bh*v/100,x=i*bw+3,w=bw-6,dt=new Date(d.date+"T12:00"),inM=dt.getMonth()+1===month;g+=`<g class="db ${best.has(d.date)?"best":""} ${inM?"":"out"}"><title>${dayLabel(d.date)} · ${v} · ${Math.round(d.tmax)}°/${Math.round(d.tmin)}°${d.pop!=null?` · %${Math.round(d.pop)} yağış`:""}</title><rect class="bar" x="${x}" y="${H-B-h}" width="${w}" height="${Math.max(h,2)}"/><text class="l" x="${x+w/2}" y="${H-15}">${dt.getDate()}</text><text class="l2" x="${x+w/2}" y="${H-3}">${dayLabel(d.date,{weekday:"narrow"})}</text></g>`});
  const b=bestDays(r),txt=!b||b.none?`${monthTr[month]} henüz tahmin aralığında değil.`:nights>0&&b.win?`${nights} gece için en iyisi <b>${dayLabel(b.win.from)} – ${dayLabel(b.win.to)}</b>`:`En iyi: <b>${b.top.map(d=>dayLabel(d.date)).join(" · ")}</b>`;
  return `<div class="chart"><h4>Önümüzdeki ${ds.length} gün<span>canlı tahmin · turuncu = en iyi 3 gün</span></h4><svg viewBox="0 0 ${W} ${H}">${g}</svg><p class="bd">${txt}</p></div>`}

/* ---------- Rota penceresi ---------- */
const routeDialog=document.querySelector("#routeDialog"),filterDialog=document.querySelector("#filterDialog"),suggestDialog=document.querySelector("#suggestDialog");
function lodgingHtml(r){const l=r.lodging;if(!l||nights===0)return "";const rooms=Math.ceil(people/2),eur=l.currency==="EUR",min=rooms*nights*(eur?l.min_eur:l.min_try),max=rooms*nights*(eur?l.max_eur:l.max_try),per=Math.ceil((min+max)/2/people),cur=eur?"€":"₺";return `<div class="lodge"><h4>Konaklama <span>· ${people} kişi · ${nights} gece</span></h4><div class="kv"><div><b>${min.toLocaleString("tr-TR")}–${max.toLocaleString("tr-TR")} ${cur}</b><span>toplam</span></div><div><b>~${per.toLocaleString("tr-TR")} ${cur}</b><span>kişi başı</span></div></div><small>tahmini · ulaşım ve yemek hariç</small></div>`}
function showDetail(r){
  selected=r.id;const s=scoreRoute(r,month),w=s.w,li=(a,c)=>a.map(x=>`<li class="${c}">${escape(x.t)}</li>`).join("");
  document.querySelector("#detail").innerHTML=`
  <div class="mhead"><div><small>${escape(regions[r.region]||r.region)} · ${escape(r.base_town||"")}</small><h2>${escape(r.name)}</h2></div><button type="button" class="x" id="closeRoute" aria-label="Kapat">×</button></div>
  <div class="mgrid"><div>
    <div class="scorehead ${TONE[tone(s.score)]}"><b>${s.score}</b><div><strong>${verdict(s.score)}</strong><span>${monthTr[month]} · ${Object.entries(s.parts).map(([k,v])=>`${PART_SHORT[k]} ${Math.round(v)}`).join(" · ")}</span></div></div>
    <div class="stats"><div><b>${r.distance_km??"—"}</b><span>km</span></div><div><b>${r.elevation_gain_m??"—"}</b><span>tırmanış m</span></div><div><b>${durNum(r)}</b><span>saat</span></div><div><b>${lname(r).toLocaleLowerCase("tr-TR")}</b><span>zorluk</span></div>${w?`<div><b>${Math.round(w.tmax)}°/${Math.round(w.tmin)}°</b><span>gündüz/gece</span></div><div><b>%${Math.round((w.rain??0)*100)}</b><span>yağışlı gün</span></div><div><b>${w.sun==null?"—":fmt(w.sun)}</b><span>güneş sa</span></div><div><b>${fmt(s.day)}</b><span>ışık sa</span></div>`:""}</div>
    <ul class="pc">${li(s.pros.slice(0,4),"pro")}${li(s.cons.slice(0,4),"con")}</ul>
    ${dayChart(r)}${yearChart(r,s)}
  </div><div>
    <div id="modalMap"></div><p class="mapcap">${r.map?.geometry_geojson?"turuncu çizgi = rota":"turuncu nokta = başlangıç · kırmızı çizgiler = bölgedeki işaretli patikalar (OSM)"}</p>
    ${r.season_warning_tr?`<p class="warn">${escape(r.season_warning_tr)}</p>`:""}
    ${lodgingHtml(r)}
    <div class="links"><a href="${r.source_url}" target="_blank" rel="noopener">Kaynak ↗</a><a href="https://www.openstreetmap.org/?mlat=${r.lat}&mlon=${r.lon}#map=13/${r.lat}/${r.lon}" target="_blank" rel="noopener">Haritada aç ↗</a></div>
  </div></div>`;
  document.querySelector("#closeRoute").onclick=()=>routeDialog.close();
  document.querySelectorAll("#detail .yb").forEach(g=>g.onclick=()=>setMonth(+g.dataset.m));
  drawModalMap(r)}
function openRoute(id){const r=routes.find(v=>v.id===id);if(!r)return;showDetail(r);if(!routeDialog.open)routeDialog.showModal();routeDialog.scrollTop=0;document.querySelectorAll("#routes .row").forEach(x=>x.classList.toggle("sel",x.dataset.route===id))}

/* ---------- Açılış ---------- */
async function boot(){try{const [de,tr]=await Promise.all([fetch("./trails.json").then(r=>r.json()),fetch("./trails-turkey.json").then(r=>r.json())]);catalog={de,tr};routes=[...(de.trails||[]),...(tr.trails||[])];render();ensureWeather(month);getForecast().then(render).catch(()=>render());loadStatic()}catch(e){document.querySelector("#routes").innerHTML='<div class="empty">Rota katalogları yüklenemedi.</div>'}}
document.querySelector("#openFilters").onclick=()=>{renderFilters();filterDialog.showModal()};
document.querySelector("#filterApply").onclick=()=>filterDialog.close();
document.querySelector("#filterClose").onclick=()=>filterDialog.close();
document.querySelector("#filterReset").onclick=()=>{({area,origin,trip,len,difficulty,people,nights,minScore}=DEFAULTS);showAll=false;savePrefs();render();renderFilters()};
document.querySelector("#openSuggest").onclick=()=>suggestDialog.showModal();
document.querySelector("#suggestClose").onclick=()=>suggestDialog.close();
[routeDialog,filterDialog,suggestDialog].forEach(d=>d.addEventListener("click",e=>{if(e.target===d)d.close()}));
routeDialog.addEventListener("close",()=>{selected=null;if(modalMap){modalMap.remove();modalMap=null}document.querySelectorAll("#routes .sel").forEach(x=>x.classList.remove("sel"))});
const suggestionKey="cayir-cimen-route-suggestions";
function getSuggestions(){try{return JSON.parse(localStorage.getItem(suggestionKey)||"[]")}catch(e){return[]}}
function renderSuggestions(){const items=getSuggestions();document.querySelector("#suggestionList").textContent=items.length?`${items.length} öneri yerel olarak saklanıyor. En son öneri: ${items[items.length-1].name}`:"Henüz kaydedilmiş rota önerisi yok."}
document.querySelector("#suggestionForm").addEventListener("submit",e=>{e.preventDefault();const form=new FormData(e.currentTarget),item={name:String(form.get("name")).trim(),town:String(form.get("town")).trim(),month:form.get("month")?+form.get("month"):null,url:String(form.get("url")).trim(),note:String(form.get("note")).trim(),createdAt:new Date().toISOString()};const items=getSuggestions();items.push(item);localStorage.setItem(suggestionKey,JSON.stringify(items));e.currentTarget.reset();document.querySelector("#suggestionStatus").textContent="Öneri kaydedildi.";renderSuggestions()});
document.querySelector("#exportSuggestions").onclick=()=>{const items=getSuggestions();if(!items.length){document.querySelector("#suggestionStatus").textContent="İndirilecek öneri yok.";return}const blob=new Blob([JSON.stringify({suggestions:items},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="rota-onerileri.json";a.click();URL.revokeObjectURL(url);document.querySelector("#suggestionStatus").textContent="rota-onerileri.json indirildi."};
document.querySelector("#openIssue").onclick=()=>{const form=new FormData(document.querySelector("#suggestionForm")),name=String(form.get("name")).trim()||"Yeni rota önerisi",town=String(form.get("town")).trim(),monthName=form.get("month")?monthNames[+form.get("month")]: "Belirtilmedi",url=String(form.get("url")).trim(),note=String(form.get("note")).trim(),body=`Rota adı: ${name}\nŞehir/bölge: ${town||"Belirtilmedi"}\nAy: ${monthName}\nKaynak: ${url||"Eklenmedi"}\n\nNot:\n${note||"Belirtilmedi"}`;window.open(`https://github.com/sahinoglumelisa/cayir-cimen-geze-geze/issues/new?title=${encodeURIComponent("Rota önerisi: "+name)}&body=${encodeURIComponent(body)}&labels=${encodeURIComponent("route-suggestion")}`,"_blank","noopener")};
renderSuggestions();
boot();
</script>
